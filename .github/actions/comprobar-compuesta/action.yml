name: Comprobar archivo
description: Comprueba si existe index.php
runs:
  using: composite
  steps:
    - name: Buscar index.php
      shell: bash
      run: |
        if [ -f index.php ]; then
          echo "OK: existe index.php"
        else
          echo "ERROR: falta index.php"
          exit 1
        fi
