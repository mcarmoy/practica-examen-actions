name: Comprobar ramas
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Comprobar sintaxis
        run: php -l index.php
