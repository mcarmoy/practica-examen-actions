name: Diagnostico
on: workflow_dispatch
jobs:
  entorno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: php -v
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --version
          
