name: Diagnostico
on: workflow_dispatch
jobs:
  entorno:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Instalar PHP
        id: configurar_php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite

      - name: Ver version de PHP
        run: |
          echo "La version de PHP instalada es:"
          echo "${{ steps.configurar_php.outputs.php-version }}"

      - name: Instalar Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Ver version de Node
        run: node --version

      - name: Comprobar entorno
        run: |
          php -v
          php -m | grep -i sqlite
          
