name: Probar 2 jobs
on:
  workflow_dispatch:

jobs:
  uno:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Soy el job uno"

  dos:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Soy el job dos"
      - run: exit 1

  final:
    needs: [ uno, dos]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Uno y dos han terminado bien"
