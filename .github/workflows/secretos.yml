name: Usando Secretos
on:
  workflow_dispatch:

jobs:
  usoSecretos:
    runs-on: ubuntu-latest
    steps:
      - name: Probar Secreto
        env:
          MI_SECRETO: ${{ secrets.MI_SECRETO }}
          NO_EXISTE: ${{ secrets.SECRETO_QUE_NO_EXISTE }}
        run: |
          echo "El secreto es: $MI_SECRETO"
          echo "Al reves: $(echo "$MI_SECRETO" | rev)"
          echo "El que no existe vale: [$NO_EXISTE]"
